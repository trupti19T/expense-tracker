{% extends "base.html" %}
{% block title %}Sign in — Expense Tracker{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card form-card auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign in</h1>
    <p>Your finances, right where you left them.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></p>
        <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
        <button class="btn" type="submit">Sign in</button>
    </form>
    <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
