{% extends "base.html" %}
{% block title %}Add Expense — Expense Tracker{% endblock %}
{% block content %}
<h1>Add Expense</h1>
<div class="divider">♥</div>
<div class="card form-card">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label for="title">What did you spend on?</label><br><input id="title" type="text" name="title" maxlength="120" required></p>
        <p><label for="amount">Amount (₹)</label><br><input id="amount" type="number" name="amount" step="0.01" min="0.01" max="9999999999.99" required></p>
        <p><label for="category">Category</label><br><select id="category" name="category" required><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Other</option></select></p>
        <p><label for="expense_date">Date</label><br><input id="expense_date" type="date" name="expense_date" max="{{ today }}" required></p>
        <button type="submit">Save Expense</button>
    </form>
    <p><a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
</div>
{% endblock %}
