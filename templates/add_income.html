{% extends "base.html" %}
{% block title %}Add Income{% endblock %}

{% block content %}
<h1>Add Income</h1>
<div class="divider">♥</div>

<div class="card">
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST">
        <p>
            <label>Income source</label><br>
            <input type="text" name="source" placeholder="e.g. Pocket money, Salary" required>
        </p>
        <p>
            <label>Amount (₹)</label><br>
            <input type="number" name="amount" step="0.01" min="0.01" required>
        </p>
        <p>
            <label>Date</label><br>
            <input type="date" name="income_date" max="{{ today }}" required>
        </p>
        <button type="submit">Save Income</button>
    </form>
    <p><a href="/dashboard">← Back to dashboard</a></p>
</div>
{% endblock %}
