{% extends "base.html" %}
{% block title %}Add Income — Expense Tracker{% endblock %}
{% block content %}
<h1>Add Income</h1>
<div class="divider">♥</div>
<div class="card form-card">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p><label for="source">Income source</label><br><input id="source" type="text" name="source" maxlength="120" placeholder="e.g. Pocket money, Salary" required></p>
        <p><label for="amount">Amount (₹)</label><br><input id="amount" type="number" name="amount" step="0.01" min="0.01" max="9999999999.99" required></p>
        <p><label for="income_date">Date</label><br><input id="income_date" type="date" name="income_date" max="{{ today }}" required></p>
        <button type="submit">Save Income</button>
    </form>
    <p><a href="{{ url_for('dashboard') }}">← Back to dashboard</a></p>
</div>
{% endblock %}
